# Enlaza este runtime jar con su futuro módulo de deployment
# (aws-kms-starter-buildtime, Fase 2 — aún no existe en este monorepo),
# donde viviría un KmsDefaultConfigProcessor (@BuildStep) análogo al
# S3DefaultConfigProcessor de aws-s3-starter. Sin este archivo, Quarkus
# nunca escanearía ese módulo durante augmentation de una app consumidora.
#
# La versión está hardcodeada (no ${project.version}) porque este es un
# resource estático sin filtering habilitado en el pom.xml: si se sube la
# <version> del proyecto, hay que actualizarla acá también.
deployment-artifact=com.saywa.framework\:aws-kms-starter-buildtime\:1.1.0-SNAPSHOT
