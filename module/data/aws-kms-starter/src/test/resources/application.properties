# Configuracion de Quarkus/quarkus-amazon-kms usada por los tests de este
# modulo. No apunta a AWS KMS real: usa credenciales estaticas ficticias y,
# en el perfil %test (el que activa Maven al ejecutar "mvn test"), un
# endpoint-override apuntando a LocalStack (localhost:4566) en lugar del
# endpoint real de AWS.
#
# Los tests unitarios de src/test/java/unit/ NO usan @QuarkusTest ni levantan
# contexto CDI (mockean KmsAsyncClient directamente con Mockito), por lo que
# este archivo no es necesario para que esos tests pasen. Existe para los
# tests de integracion (src/test/java/integration/, perfil Maven aparte) que
# sí levantan Quarkus real contra LocalStack.
#
# Nota: GenerateMac/VerifyMac (usados por sign()/verify()) requieren
# LocalStack Pro; la edicion community solo soporta CreateKey, Encrypt,
# Decrypt, GenerateDataKey y Sign/Verify asimetrico. Los tests de
# integracion de sign()/verify() deben omitirse (o mockear KmsAsyncClient
# igualmente) si el entorno solo tiene LocalStack community.
quarkus.kms.aws.region=us-east-1
quarkus.kms.aws.credentials.type=static
quarkus.kms.aws.credentials.static-provider.access-key-id=test
quarkus.kms.aws.credentials.static-provider.secret-access-key=test

# Timeouts explícitos del cliente async (Netty), en vez de depender de los
# defaults implícitos de quarkus-amazon-kms.
quarkus.kms.async-client.connection-timeout=10S
quarkus.kms.async-client.connection-acquisition-timeout=5S
quarkus.kms.async-client.read-timeout=30S
quarkus.kms.async-client.write-timeout=30S

%test.quarkus.kms.endpoint-override=http://localhost:4566
