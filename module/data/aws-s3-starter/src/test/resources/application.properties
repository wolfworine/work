# Configuracion de Quarkus/quarkus-amazon-s3 usada por los tests de este
# modulo. No apunta a Amazon S3 real: usa credenciales estaticas ficticias y,
# en el perfil %test (el que activa Maven al ejecutar "mvn test"), un
# endpoint-override apuntando a LocalStack (localhost:4566) en lugar del
# endpoint real de AWS.
#
# Los tests unitarios de src/test/java/unit/ NO usan @QuarkusTest ni levantan
# contexto CDI (mockean S3AsyncClient/S3Presigner directamente con Mockito),
# por lo que este archivo no es necesario para que esos tests pasen. Existe
# para los tests de integracion (src/test/java/integration/, perfil Maven
# aparte) que sí levantan Quarkus real contra LocalStack.
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test

# Timeouts explícitos del cliente async (Netty), en vez de depender de los
# defaults implícitos de quarkus-amazon-s3.
quarkus.s3.async-client.connection-timeout=10S
quarkus.s3.async-client.connection-acquisition-timeout=5S
quarkus.s3.async-client.read-timeout=30S
quarkus.s3.async-client.write-timeout=30S

%test.quarkus.s3.endpoint-override=http://localhost:4566
