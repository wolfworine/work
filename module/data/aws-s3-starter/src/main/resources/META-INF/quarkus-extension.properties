# Enlaza este runtime jar con su módulo de deployment (aws-s3-starter-buildtime),
# donde vive S3DefaultConfigProcessor (@BuildStep). Sin este archivo, Quarkus
# nunca escanea ese módulo durante augmentation (mvn quarkus:dev / mvn package)
# de una app consumidora — aws-s3-starter no seria reconocido como extensión.
#
# La versión está hardcodeada (no ${project.version}) porque este es un
# resource estático sin filtering habilitado en el pom.xml: si se sube la
# <version> del proyecto, hay que actualizarla acá también.
deployment-artifact=com.saywa.framework\:aws-s3-starter-buildtime\:1.1.0-SNAPSHOT
