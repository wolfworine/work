# ============================================================================
# aws-s3-starter-deployment — configuración
# ============================================================================

quarkus.application.name=aws-s3-starter-deployment

# aws-s3-starter no publica un índice Jandex (META-INF/jandex.idx) en su jar,
# así que sin esto ArC no descubre S3StorageServiceImpl (@ApplicationScoped)
# y falla con UnsatisfiedResolutionException al inyectar S3StorageService.
quarkus.index-dependency.aws-s3-starter.group-id=com.saywa.framework
quarkus.index-dependency.aws-s3-starter.artifact-id=aws-s3-starter

# ---------------------------------------------------------------------------
# compartamos.storage.s3.* — propio del starter aws-s3-starter
# ---------------------------------------------------------------------------
compartamos.storage.s3.bucket-name=saywa-s3-deployment-poc
compartamos.storage.s3.default-prefix=poc
compartamos.storage.s3.max-upload-size=20971520
compartamos.storage.s3.max-download-size=20971520
compartamos.storage.s3.presigned-ttl=PT10M

# ---------------------------------------------------------------------------
# quarkus.s3.* — gestionado por io.quarkiverse.amazonservices:quarkus-amazon-s3
# (transitivo vía aws-s3-starter)
# ---------------------------------------------------------------------------
quarkus.s3.aws.region=us-east-1

# LocalStack requiere path-style access (bucket.localhost no resuelve en local)
quarkus.s3.path-style-access=true

# Timeouts explícitos del cliente async (Netty). Sin esto, el starter depende
# de los defaults implícitos de quarkus-amazon-s3 (connection-timeout=10S,
# read/write-timeout=30S) — se fijan aquí para que sean visibles y ajustables
# sin tener que consultar el código fuente de la extensión.
quarkus.s3.async-client.connection-timeout=10S
quarkus.s3.async-client.connection-acquisition-timeout=5S
quarkus.s3.async-client.read-timeout=30S
quarkus.s3.async-client.write-timeout=30S

# Dev Services de quarkus-amazon-s3: alternativa a docker-compose.yml para
# loop rápido en `mvn quarkus:dev` (ver docs/architecture.md). Deshabilitado
# por defecto para no chocar con el LocalStack levantado manualmente.
quarkus.s3.devservices.enabled=false

# ---------------------------------------------------------------------------
# %dev — LocalStack levantado por docker-compose.yml en localhost:4566
# ---------------------------------------------------------------------------
%dev.quarkus.s3.endpoint-override=http://localhost:4566
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test

# ---------------------------------------------------------------------------
# %test — mismo LocalStack, usado por src/test/java/integration/
# ---------------------------------------------------------------------------
%test.quarkus.s3.endpoint-override=http://localhost:4566
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.compartamos.storage.s3.bucket-name=saywa-s3-deployment-poc

# ---------------------------------------------------------------------------
# %prod — placeholder: en un despliegue real, region/credenciales vendrían de
# IAM role o variables de entorno. Este proyecto es un PoC contra LocalStack,
# NO configurar credenciales reales aquí.
# ---------------------------------------------------------------------------
# %prod.quarkus.s3.aws.region=${AWS_REGION}
# %prod.quarkus.s3.aws.credentials.type=default

# HTTP
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI — /q/openapi (importable en Postman) y /q/swagger-ui
# para probar los 8 endpoints con datos de prueba sin depender del LocalStack
# Web App. always-include=true para que estén disponibles también en el jar
# empaquetado (por defecto Swagger UI solo se incluye en dev).
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Saywa AWS S3 Starter — Deployment PoC
quarkus.smallrye-openapi.info-description=Endpoints REST reactivos que envuelven S3StorageService (aws-s3-starter) contra LocalStack.
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
