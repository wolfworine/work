# ============================================================================
# aws-s3-starter-smoke — a propósito, SIN compartamos.storage.s3.*
#
# Este módulo existe para probar que S3DefaultConfigProcessor
# (aws-s3-starter-buildtime, @BuildStep applyS3Default) suple esos 5 valores
# en dev/test. Si esta app arranca sin que S3ConfigurationValidator explote
# con IllegalArgumentException ("bucket-name must not be null or empty"),
# el BuildStep funcionó — no lo agregues acá o dejás de probar nada.
# ============================================================================

quarkus.application.name=aws-s3-starter-smoke

# aws-s3-starter no publica un índice Jandex, así que sin esto ArC no
# descubre S3StorageServiceImpl (@ApplicationScoped) al inyectar
# S3StorageService (mismo workaround que aws-s3-starter-deployment).
quarkus.index-dependency.aws-s3-starter.group-id=com.saywa.framework
quarkus.index-dependency.aws-s3-starter.artifact-id=aws-s3-starter

# ---------------------------------------------------------------------------
# quarkus.s3.* — namespace de quarkus-amazon-s3, no de este starter: no lo
# cubre S3DefaultConfigProcessor (que solo defaultea compartamos.storage.s3.*),
# así que sí hace falta declararlo.
# ---------------------------------------------------------------------------
quarkus.s3.aws.region=us-east-1
quarkus.s3.path-style-access=true

# ---------------------------------------------------------------------------
# %dev — mismo LocalStack que levanta aws-s3-starter-deployment/docker-compose.yml
# (ya crea los dos buckets que usa SmokeRunner: saywa-s3-deployment-poc y
# saywa-s3-deployment-poc-secondary). Arrancar ese docker compose antes de
# correr mvn quarkus:dev acá.
# ---------------------------------------------------------------------------
%dev.quarkus.s3.endpoint-override=http://localhost:4566
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
